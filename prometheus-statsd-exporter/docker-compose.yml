services:
  prometheus-statsd-exporter:
    image: "docker.io/prom/statsd-exporter:v0.30.0-distroless@sha256:2225d48bea4943b075182244de3b96fc2327747502a253057592af99c34ea935"
    ports:
      - "8125:9125/tcp"
      - "8125:9125/udp"
      - "9102:9102" # Scrape port
  prometheus:
    image: "docker.io/prom/prometheus:v3.13.1-distroless@sha256:214f8427c8fba80c327bb94a75feb802ae12f2d6ca30812aa6e7d22f09bbea80"
    ports:
      - "9090:9090/tcp"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"